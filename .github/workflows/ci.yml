name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck · Lint · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  e2e:
    name: Build · E2E (Electron)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # GitHub CI containers can't enable Chromium's user-namespace sandbox
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Electron runtime system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libgtk-3-0 libx11-xcb1 xvfb
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron ABI
        run: npx electron-builder install-app-deps
      - name: Build
        run: npm run build
      - name: E2E tests
        run: xvfb-run -a npm run test:e2e

  # ---- Packaging & release ------------------------------------------------
  # Packaging jobs run on manual dispatch or v* tag pushes, and upload the
  # installers together with the electron-updater metadata (latest*.yml and
  # the NSIS blockmap) — auto-update needs those files attached to the
  # release, not just the binaries.
  #
  # The `publish` job (tags only) runs after quality, e2e and all four
  # platform packages succeed, then attaches every artifact to a GitHub
  # Release for the tag via softprops/action-gh-release.
  #
  # CSC_IDENTITY_AUTO_DISCOVERY=false lets the build succeed without a
  # signing certificate (CI runners have no keychain identity). When the
  # CSC_LINK secrets are set, electron-builder signs with those certs. Note
  # an unsigned macOS zip/dmg cannot be auto-updated by electron-updater,
  # only installed manually.

  release-windows:
    name: Package Windows (NSIS + Portable)
    runs-on: windows-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron ABI
        run: npx electron-builder install-app-deps
      - name: Build (electron-vite)
        run: npm run build
      - name: Prepare signing env (if certificate configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - name: Package Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ourcode-ide-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  release-macos-arm64:
    name: Package macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron ABI
        run: npx electron-builder install-app-deps
      - name: Build (electron-vite)
        run: npm run build
      - name: Prepare signing env (if certificate configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi
      - name: Package macOS app (arm64)
        run: npm run dist:mac -- --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ourcode-ide-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error

  release-macos-x64:
    name: Package macOS (Intel)
    # macos-13 is GitHub's Intel (x64) macOS runner; keeps native modules
    # (better-sqlite3, node-pty) compiled natively per arch.
    runs-on: macos-13
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron ABI
        run: npx electron-builder install-app-deps
      - name: Build (electron-vite)
        run: npm run build
      - name: Prepare signing env (if certificate configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi
      - name: Package macOS app (x64)
        run: npm run dist:mac -- --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ourcode-ide-macos-x64
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error

  release-linux:
    name: Package Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron ABI
        run: npx electron-builder install-app-deps
      - name: Build (electron-vite)
        run: npm run build
      - name: Package Linux (AppImage + deb)
        run: npm run dist:linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ourcode-ide-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - quality
      - e2e
      - release-windows
      - release-macos-arm64
      - release-macos-x64
      - release-linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
